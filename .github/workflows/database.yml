name: database

on:
  pull_request:
    paths:
      - "packages/database/**"
      - "packages/identity/**"
      - "packages/conversations/**"
      - "tools/check-boundaries.mjs"
      - "tools/boundary-rules.mjs"
      - "tools/boundary-rules.test.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "compose.yaml"
      - ".github/workflows/database.yml"

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://issuespan:issuespan-local-only@localhost:5432/issuespan
      DATABASE_TEST_URL: postgresql://issuespan:issuespan-local-only@localhost:5432/issuespan
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture:check
      - run: docker compose up -d postgres
      - run: pnpm db:validate
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:test
